global:
  scrape_interval: 15s

scrape_configs:
  - job_name: reviewdesk
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local-metrics-token   # must match METRICS_TOKEN in docker-compose.yml
    static_configs:
      - targets: ["app:4000"]

# Useful queries once it is running:
#   rate(http_request_duration_seconds_count[5m])                          requests per second
#   histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))   p95 latency per route
#   sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))       server errors per second
